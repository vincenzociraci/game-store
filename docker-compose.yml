services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:4173
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "4173:4173"
    depends_on:
      - backend
    tty: true
    stdin_open: true